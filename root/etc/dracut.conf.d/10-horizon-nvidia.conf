# Horizon Linux: pull the Nvidia modules (built by akmods at image-creation
# time, see config.sh) into the initramfs so nvidia-drm.modeset=1 gives
# early KMS instead of a late modeset flicker on the "Nvidia" GRUB entry.
#
# add_drivers (not force_drivers): if the modules are missing - e.g. the
# akmods build failed and was logged rather than fatal - the initramfs
# build only warns, it does not abort.
add_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "
