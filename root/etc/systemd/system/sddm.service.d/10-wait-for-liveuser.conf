# liveuser (used for SDDM autologin, see /etc/sddm.conf.d/) is created
# dynamically at boot by livesys.service (from livesys-scripts), not baked
# into the image. Without this, sddm.service could start before that
# account exists, since both are pulled in around the same point in boot
# with no dependency between them by default.
[Unit]
Wants=livesys.service
After=livesys.service
