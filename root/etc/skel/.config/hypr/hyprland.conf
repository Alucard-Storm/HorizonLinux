# Horizon Linux default configuration
# Replace this with your own dotfiles when the project grows.
# Reference: https://github.com/CachyOS/cachyos-hypr-noctalia

monitor=,preferred,auto,1

# Nvidia + Wayland - applied conditionally at runtime below, NOT hardcoded
# here. A static `env =` line would force every app toward the Nvidia
# GL/VA-API vendor library even when booted via the "Legacy" GRUB entry
# (which blacklists nvidia) or on hardware/VMs with no Nvidia GPU at all -
# that would break rendering instead of falling back gracefully.

$terminal = kitty
$ipc = noctalia msg

# Push the Wayland session vars into the systemd user + D-Bus activation
# environment. xdg-desktop-portal needs this, and so does Anaconda's
# webui-desktop, which greps the user's `systemctl --user show-environment`
# for WAYLAND_DISPLAY to decide it can render the installer here.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

exec-once = noctalia
exec-once = systemctl --user start hyprpolkitagent
exec-once = sh -c 'if lsmod | grep -q "^nvidia "; then hyprctl setenv LIBVA_DRIVER_NAME nvidia; hyprctl setenv __GLX_VENDOR_LIBRARY_NAME nvidia; hyprctl setenv NVD_BACKEND direct; hyprctl setenv WLR_NO_HARDWARE_CURSORS 1; fi'
exec-once = xdg-user-dirs-update

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = yes
}

# Hold SUPER to drag-move (left button) or drag-resize (right button).
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# --- Apps & session ---
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, SPACE, exec, $ipc panel-toggle launcher
bind = SUPER, S, exec, $ipc panel-toggle control-center
bind = SUPER, comma, exec, $ipc settings-toggle
bind = SUPER, E, exec, pcmanfm-qt
bind = SUPER, B, exec, firefox
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, L, exec, loginctl lock-session
# Ends the session immediately with no confirmation - deliberately behind
# SHIFT so a single slipped key can't do it. Use the Noctalia dock for a
# normal logout / reboot / shutdown menu.
bind = SUPER SHIFT, M, exit

# --- Focus (SUPER) and move window (SUPER+SHIFT) within the layout ---
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d
bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d

# --- Workspaces: SUPER+N to switch, SUPER+SHIFT+N to send the window there ---
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# --- Hardware keys ---
# Volume / mic via PipeWire (wpctl, from wireplumber). bindel repeats while
# held; bindl keeps working on the lock screen. Noctalia shows its own OSD
# when it sees the level change, so nothing else is needed here.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Backlight (brightnessctl)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
# Media transport (playerctl)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

# --- Screenshots ---
# Print = whole output to a file; SHIFT+Print = pick a region to a file;
# CTRL+Print = pick a region straight to the clipboard.
# Files land in ~/Pictures, created by xdg-user-dirs-update above.
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%s).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy
