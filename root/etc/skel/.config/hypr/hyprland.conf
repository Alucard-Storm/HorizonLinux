# Horizon Linux default configuration
# Replace this with your own dotfiles when the project grows.
# Reference: https://github.com/CachyOS/cachyos-hypr-noctalia

monitor=,preferred,auto,1

# Nvidia + Wayland
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = WLR_NO_HARDWARE_CURSORS,1

$terminal = foot
$ipc = noctalia msg

exec-once = noctalia
exec-once = systemctl --user start hyprpolkitagent

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = yes
}

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, SPACE, exec, $ipc panel-toggle launcher
bind = SUPER, S, exec, $ipc panel-toggle control-center
bind = SUPER, comma, exec, $ipc settings-toggle
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, F, fullscreen
