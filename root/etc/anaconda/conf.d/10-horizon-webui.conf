# Horizon Linux: force the Anaconda Web UI browser engine.
#
# Anaconda 44 renders its Web UI in a real browser. Fedora's *spin* profiles
# (fedora-sway, fedora-i3, fedora-kde, ...) set this to "slitherer" - a small
# Qt kiosk browser - and ship that package in their kickstarts. Horizon does
# not: slitherer is only in updates-testing for F44, and this image already
# ships Firefox (see config.xml), which is what the base "fedora" profile
# uses anyway.
#
# Without this override the detected profile leaves webui_web_engine =
# slitherer, and /usr/libexec/anaconda/webui-desktop dies with
# "env: 'slitherer': No such file or directory", aborting the installer.
#
# conf.d drop-ins are read after the profile config, so this wins.
[User Interface]
webui_web_engine = firefox
